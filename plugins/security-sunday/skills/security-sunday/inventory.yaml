# Security Sunday inventory. The coordinator updates it after every run from the reports'
# "Inventory changes". null = unknown, never a guess.
#
# push_policy:
#   direct   push the default branch (it may deploy production: see deploy.trigger)
#   pr-only  branch security-sunday/<date>, push, gh pr create
#   ask      commit only if the project allows git; ask the user before pushing
#   skip     not patched on a Sunday (stale, third-party, superseded); listed in the report
#
# gh_account: the account for `GH_TOKEN=$(gh auth token -u <account>)` on gh calls and on
# pushes to https:// remotes. git@ remotes push with the Mac's SSH key, which is tonyjara.
#
# key_deps are what was installed when last checked; the project's lockfile is the truth.
#
# release_age: every project refuses package versions younger than two days, permanently
# (SKILL.md, step 4). Per project: set = in the repo, missing = add it this Sunday,
# n/a = no package manager with dependencies.
release_age:
  minutes: 2880
  pnpm: "pnpm-workspace.yaml: minimumReleaseAge: 2880"
  npm: ".npmrc: min-release-age=2"
  bun: "bunfig.toml: [install] minimumReleaseAge = 172800"
  yarn: ".yarnrc.yml: npmMinimalAgeGate: 2880"

